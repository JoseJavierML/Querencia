<!DOCTYPE html><html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Querencia | El refugio del oyente</title>
    <!-- Tipografías literarias con alma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060608;
            --glass-bg: rgba(10, 10, 12, 0.72); 
            --text-main: #f4f4f5;
            --text-muted: #8b8f9e;
            --gold-light: #eaddb3;
            --gold-dark: #b89345;
            --gold-subtle: rgba(184, 147, 69, 0.25);
            --crimson-dark: #3a0a0a;
            --border-color: rgba(184, 147, 69, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            position: relative;
            /* Textura de grano/ruido analógico */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* --- Lienzo de Humo Interactivo y Destacado --- */
        #soulCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: auto; /* Permite capturar el movimiento del ratón */
            opacity: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Deja pasar el ratón al canvas en las zonas vacías */
        }

        .content-wrapper > * {
            pointer-events: auto; /* Reactiva los clics en los formularios */
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 2s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
            color: var(--gold-light);
            font-weight: 700;
            font-style: italic;
            letter-spacing: 2px;
            text-shadow: 0 0 35px rgba(234, 221, 179, 0.28);
        }

        p.subtitle {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            color: rgba(244, 244, 245, 0.82);
            font-style: italic;
            letter-spacing: 1px;
        }

        /* --- Acceso Sagrado con Google: Elegancia y Duende --- */
        .google-section {
            width: 100%;
            max-width: 520px;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 1.4s ease 0.3s both;
        }

        .google-auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            padding: 0.95rem 1.8rem;
            background: linear-gradient(135deg, rgba(20, 18, 22, 0.85) 0%, rgba(12, 11, 15, 0.92) 100%);
            border: 1px solid var(--gold-dark);
            border-radius: 40px;
            color: var(--gold-light);
            font-family: 'Lora', serif;
            font-size: 1.05rem;
            font-style: italic;
            text-decoration: none;
            letter-spacing: 0.8px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(184, 147, 69, 0.1);
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .google-auth-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(234, 221, 179, 0.15), transparent);
            transition: left 0.7s ease;
        }

        .google-auth-btn:hover {
            transform: translateY(-2px);
            border-color: var(--gold-light);
            color: #ffffff;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 25px rgba(184, 147, 69, 0.35);
        }

        .google-auth-btn:hover::before {
            left: 100%;
        }

        .google-icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            padding: 3px;
        }

        .google-icon-wrapper svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .or-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 1.3rem;
            gap: 1.2rem;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(184, 147, 69, 0.3), transparent);
        }

        .or-divider span {
            font-family: 'Lora', serif;
            font-size: 0.8rem;
            font-style: italic;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Panel de Cristal (Glassmorphism Flamenco) --- */
        .auth-panel {
            background-color: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-top: 1px solid rgba(234, 221, 179, 0.3);
            border-radius: 6px;
            display: flex;
            width: 100%;
            max-width: 850px;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5), 0 25px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            animation: fadeInUp 1.5s ease 0.5s both;
        }

        .auth-section {
            flex: 1;
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
        }

        .divider {
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(184, 147, 69, 0.35), transparent);
        }

        .auth-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.55rem;
            margin-bottom: 2.2rem;
            color: var(--text-main);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            letter-spacing: 0.5px;
        }

        .auth-section h2 svg {
            width: 20px; height: 20px;
            fill: none; stroke: var(--gold-dark);
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            height: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            padding: 0.8rem 0;
            font-size: 1.1rem;
            font-family: 'Lora', serif;
            transition: all 0.4s ease;
        }

        input:focus {
            outline: none;
            border-bottom-color: var(--gold-light);
            box-shadow: 0 1px 0 0 var(--gold-light);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.32);
            font-style: italic;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #0a0a0c inset !important;
            -webkit-text-fill-color: var(--text-main) !important;
        }

        .forgot-link {
            align-self: flex-end;
            font-family: 'Lora', serif;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-style: italic;
            margin-top: -1.2rem;
            transition: color 0.3s;
        }

        .forgot-link:hover { color: var(--gold-light); }

        .btn-spacer { flex-grow: 1; }

        button.action-btn {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-dark);
            padding: 0.95rem 1.5rem;
            border-radius: 30px;
            font-family: 'Lora', serif;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
            width: 100%;
            letter-spacing: 0.5px;
        }

        button.action-btn:hover {
            background: rgba(184, 147, 69, 0.16);
            box-shadow: 0 0 25px rgba(184, 147, 69, 0.28);
            transform: translateY(-2px);
            border-color: var(--gold-light);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .auth-panel { flex-direction: column; }
            .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, rgba(184, 147, 69, 0.3), transparent); }
            .auth-section { padding: 2.5rem; }
            h1 { font-size: 3.5rem; }
            .google-section { max-width: 100%; }
        }
    </style>
</head>
<body style="min-height: 100vh; overflow: hidden auto; padding: 2.5rem 1rem;">

    <!-- Lienzo de ondas interactivas con duende flamenco -->
    <canvas id="soulCanvas" width="1280" height="826" style="position: fixed; top: 0px; left: 0px; width: 100%; height: 100%; pointer-events: auto; z-index: 0;"></canvas>

    <div class="content-wrapper">
        <header style="margin-bottom: 1.5rem;">
            <h1 class="">Querencia.</h1>
            <p class="subtitle">No escuches música. Siéntela, piénsala, compártela.</p>
        </header>

        <!-- Botón Unificado de Google: Conexión Inmediata con Estilo Querencia -->
        <div class="google-section" style="margin-bottom: 1.25rem;">
            <a href="/api/auth/google" id="google-auth-btn" class="google-auth-btn">
                <span class="google-icon-wrapper">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    </svg>
                </span>
                <span class="">Entrar o Registrarse con Google</span>
            </a>
            <div class="or-divider">
                <span class="">o con credenciales de oyente</span>
            </div>
        </div>

        <!-- Panel de Cristal Místico (Doble Umbral: Login & Registro) -->
        <div class="auth-panel">
            <div class="auth-section" style="padding: 2.5rem 3rem;">
                <h2 class="">Entrar al Tablao 
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </h2>
                <form id="login-form">
                    <div class="input-group">
                        <input type="email" id="login-email" placeholder="Correo electrónico" required="">
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-password" placeholder="Contraseña" required="">
                    </div>
                    <a href="#" class="forgot-link">Olvidé mi contraseña</a>
                    <div class="btn-spacer"></div>
                    <button type="submit" class="action-btn">Iniciar Sesión</button>
                </form>
            </div>

            <div class="divider"></div>

            <div class="auth-section" style="padding: 2.5rem 3rem;">
                <h2 class="">Crear cuenta 
                    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </h2>
                <form id="register-form">
                    <div class="input-group">
                        <input type="email" id="reg-email" placeholder="Correo electrónico" required="">
                    </div>
                    <div class="input-group">
                        <input type="password" id="reg-password" placeholder="Crea una contraseña" required="">
                    </div>
                    <div class="btn-spacer"></div>
                    <button type="submit" class="action-btn">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Animación del Alma Flamenca (Canvas Original Interactivo) -->
    <script>
        const canvas = document.getElementById('soulCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;
        let mouseX = -1000;
        let mouseY = -1000;

        const waves = [
            { amplitude: 220, length: 0.0012, speed: 0.0012, color: 'rgba(75, 12, 12, 0.35)', width: 90, offset: 40 },
            { amplitude: 160, length: 0.0018, speed: 0.0018, color: 'rgba(212, 168, 79, 0.15)', width: 55, offset: 130 },
            { amplitude: 100, length: 0.0025, speed: 0.0025, color: 'rgba(255, 238, 190, 0.08)', width: 25, offset: -30 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Rastrear el ratón por toda la pantalla
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 1;

            ctx.filter = 'blur(16px)';

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, height * 0.75 + wave.offset);

                for (let x = 0; x < width; x += 20) {
                    let distToMouse = Math.abs(x - mouseX);
                    let influence = Math.max(0, 400 - distToMouse) / 400; 
                    
                    let dynamicAmplitude = wave.amplitude + (influence * 120);
                    
                    let y = Math.sin((x * wave.length) + (time * wave.speed)) * dynamicAmplitude;
                    let y2 = Math.cos((x * wave.length * 0.4) + (time * wave.speed * 0.7)) * (dynamicAmplitude * 0.4);
                    
                    let verticalPull = (mouseY - (height * 0.75)) * influence * 0.15;

                    ctx.lineTo(x, (height * 0.75) + y + y2 + wave.offset + verticalPull);
                }

                ctx.strokeStyle = wave.color;
                ctx.lineWidth = wave.width;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
    
    <!-- Autenticación y registro de usuarios (100% compatible con api.js) -->
    <script type="module">
        import { api } from './js/api.js';

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const googleBtn = document.getElementById('google-auth-btn');

        if (googleBtn) {
            googleBtn.addEventListener('click', (e) => {
                // Si api.loginWithGoogle existe, se ejecuta; en caso contrario navega a la ruta natural /api/auth/google
                if (api && typeof api.loginWithGoogle === 'function') {
                    e.preventDefault();
                    api.loginWithGoogle();
                }
            });
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página recargue bruscamente
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const respuesta = await api.login(email, password);
                console.log('Login exitoso:', respuesta);
                window.location.href = 'diario.html';
            } catch (error) {
                alert('Fallo de acceso al tablao: ' + error.message);
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const respuesta = await api.registro(email, password);
                console.log('Registro exitoso:', respuesta);
                alert('¡Bienvenido! Tu cuenta ha sido creada. Ya puedes iniciar sesión.');
                registerForm.reset();
            } catch (error) {
                alert('Error al crear la cuenta: ' + error.message);
            }
        });
    </script>




</body></html>
