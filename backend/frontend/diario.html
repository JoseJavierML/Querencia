<!DOCTYPE html><html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Íntimo | Querencia</title>
    <!-- Tipografías literarias con alma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/vinilos.css">
    
    <style>
        :root {
            --bg-base: #060608;
            --text-main: #f4f4f5;
            --text-muted: #8b8f9e;
            --gold-light: #eaddb3;
            --gold-dark: #b89345;
            --crimson-dark: #3a0a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            /* Textura de grano/ruido analógico */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* --- Lienzo de Humo (Estático, con los tonos vivos del index) --- */
        #soulCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 1;
        }

        /* --- Navegación --- */
        nav {
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(6, 6, 8, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            font-style: italic;
            color: var(--gold-light);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(234, 221, 179, 0.2);
            transition: opacity 0.3s ease;
        }

        .brand:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-link {
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 0.5px;
        }

        .nav-link:hover {
            color: var(--gold-light);
        }

        .nav-link.active {
            color: var(--gold-light);
            font-weight: 500;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
        }

        .nav-actions { 
            display: flex; 
            gap: 1.5rem; 
            align-items: center; 
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        
        .logout-btn:hover {
            border-color: var(--gold-dark);
            color: var(--gold-light);
            background: rgba(184, 147, 69, 0.08);
        }

        /* --- Layout Abierto (Sin cajas ni cuadrados) --- */
        main {
            padding: 0 4rem;
            max-width: 1400px;
            margin: 2rem auto 0;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 5rem;
            height: calc(100vh - 150px);
            min-height: 0;
        }

        /* --- Sidebar (Memoria) --- */
        aside {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-right: 2rem;
        }

        h2.sidebar-title {
            flex-shrink: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            position: relative;
        }

        h2.sidebar-title::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 0;
            width: 30px; height: 1px;
            background-color: var(--gold-dark);
        }

        .entries-list {
            flex: 1;
            min-height: 0;
            padding-right: 0.5rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            list-style: none;
        }

        .entry-item {
            position: relative;
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            transition: border-color 0.4s ease;
        }

        .entry-item:hover,
        .entry-item.is-active {
            border-bottom-color: rgba(184, 147, 69, 0.3);
        }

        .entry-open {
            all: unset;
            box-sizing: border-box;
            display: block;
            flex: 1;
            min-width: 0;
            padding: 1.1rem 2.25rem 1.1rem 0;
            cursor: pointer;
            transition: padding-left 0.4s ease;
        }

        .entry-item:hover .entry-open,
        .entry-open:focus-visible {
            padding-left: 10px;
        }

        .entry-open:focus-visible {
            outline: 1px solid rgba(184, 147, 69, 0.45);
            outline-offset: 2px;
        }

        .entry-date {
            display: block;
            margin-bottom: 0.45rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .entry-label {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            font-family: 'Lora', serif;
            font-size: 0.98rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.55);
            transition: color 0.4s ease;
        }

        .entry-item:hover .entry-label,
        .entry-item.is-active .entry-label {
            color: var(--gold-light);
        }

        .entry-delete {
            position: absolute;
            top: 0.9rem;
            right: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: rgba(232, 160, 160, 0.45);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .entry-delete:hover:not(:disabled),
        .entry-delete:focus-visible {
            color: #e8a0a0;
            border-color: rgba(232, 160, 160, 0.35);
            background: rgba(232, 160, 160, 0.08);
            outline: none;
        }

        .entry-delete:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .entry-empty,
        .entry-error {
            padding: 1rem 0;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-muted);
        }

        .entry-error {
            color: #e8a0a0;
        }

        .editor-area {
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .editor-header {
            margin-bottom: 2rem;
            animation: fadeIn 2s ease;
        }

        .date-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-main);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .diary-view {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .diary-view[hidden] {
            display: none !important;
        }

        .title-input {
            width: 100%;
            margin-bottom: 1.2rem;
            padding: 0.45rem 0;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            color: var(--gold-light);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-style: italic;
            transition: border-color 0.4s ease;
        }

        .title-input:focus {
            outline: none;
            border-bottom-color: rgba(184, 147, 69, 0.55);
        }

        .title-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Lora', serif;
            font-size: 1rem;
            font-style: italic;
        }

        .diary-vinyl-picker {
            position: relative;
            flex: 0 0 auto;
            margin-bottom: 1.1rem;
        }

        textarea {
            flex: 1 1 auto;
            min-height: 0;
            max-height: 100%;
            padding-right: 0.5rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.25rem;
            line-height: 1.8;
            resize: none;
            font-family: 'Lora', serif;
            font-weight: 300;
            caret-color: var(--gold-light);
        }

        textarea:focus { outline: none; }
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-style: italic;
        }

        .diary-form {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .editor-footer {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: flex-end;
            gap: 1.25rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .diary-status {
            min-height: 1.2rem;
            padding-top: 0.75rem;
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            font-style: italic;
            color: var(--text-muted);
            text-align: right;
        }

        .diary-status.success { color: var(--gold-light); }
        .diary-status.error { color: #e8a0a0; }

        .save-entry-btn {
            padding: 0.7rem 1.6rem;
            border: 1px solid rgba(184, 147, 69, 0.45);
            border-radius: 30px;
            background: rgba(184, 147, 69, 0.12);
            color: var(--gold-light);
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .save-entry-btn:hover:not(:disabled) {
            background: rgba(184, 147, 69, 0.22);
            border-color: var(--gold-light);
        }

        .save-entry-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reading-view {
            flex: 1;
            min-height: 0;
            max-height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding-right: 0.75rem;
            animation: fadeIn 0.6s ease;
        }

        .entries-list,
        .reading-view,
        textarea {
            scrollbar-width: thin;
            scrollbar-color: rgba(184, 147, 69, 0.35) transparent;
        }

        .entries-list::-webkit-scrollbar,
        .reading-view::-webkit-scrollbar,
        textarea::-webkit-scrollbar {
            width: 4px;
        }

        .entries-list::-webkit-scrollbar-track,
        .reading-view::-webkit-scrollbar-track,
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        .entries-list::-webkit-scrollbar-thumb,
        .reading-view::-webkit-scrollbar-thumb,
        textarea::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(184, 147, 69, 0.35);
        }

        .entries-list::-webkit-scrollbar-thumb:hover,
        .reading-view::-webkit-scrollbar-thumb:hover,
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(184, 147, 69, 0.55);
        }

        .reading-topbar {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 1.2rem;
        }

        .reading-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .reading-action {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid rgba(232, 160, 160, 0.3);
            border-radius: 50%;
            background: rgba(232, 160, 160, 0.06);
            color: rgba(232, 160, 160, 0.75);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reading-action:hover:not(:disabled),
        .reading-action:focus-visible {
            border-color: rgba(232, 160, 160, 0.5);
            background: rgba(232, 160, 160, 0.1);
            color: #e8a0a0;
            outline: none;
        }

        .reading-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reading-action svg {
            width: 15px;
            height: 15px;
        }

        .reading-new {
            border-color: rgba(184, 147, 69, 0.4);
            background: rgba(184, 147, 69, 0.08);
            color: var(--gold-light);
        }

        .reading-new:hover:not(:disabled),
        .reading-new:focus-visible {
            border-color: rgba(234, 221, 179, 0.6);
            background: rgba(184, 147, 69, 0.16);
            color: var(--gold-light);
        }

        .reading-date {
            margin-bottom: 0.8rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .reading-title {
            margin-bottom: 1.8rem;
            overflow-wrap: anywhere;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--gold-light);
        }

        .reading-title.is-untitled {
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-muted);
        }

        .reading-content {
            flex: 0 0 auto;
            padding-bottom: 2rem;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            font-weight: 300;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            nav { padding: 1.2rem 1.5rem; flex-wrap: wrap; gap: 1rem; }
            .nav-links { gap: 1.5rem; order: 3; width: 100%; justify-content: center; }
            main {
                grid-template-columns: 1fr;
                height: auto;
                gap: 2rem;
                padding: 0 1.5rem;
            }
            body { overflow: auto; }
            .editor-area { overflow: visible; }
            .editor-footer { flex-direction: column; align-items: stretch; gap: 0.75rem; }
            .diary-status { text-align: center; }
            .save-entry-btn { width: 100%; }
            .entries-list { max-height: 40vh; }
            textarea { min-height: 40vh; }
            .reading-view {
                max-height: none;
                overflow-y: visible;
                padding-right: 0;
            }
        }
    </style>
</head>
<body>

    <canvas id="soulCanvas" width="1280" height="993"></canvas>

    <nav>
        <div class="brand-container">
            <a href="muro.html" class="brand">Querencia.</a>
        </div>
        
        <div class="nav-links">
            <a href="muro.html" class="nav-link">Muro de Debates</a>
            <a href="diario.html" class="nav-link active">Diario Íntimo</a>
            <a href="velo.html" class="nav-link">El Velo</a>
            <a href="archivo.html" class="nav-link">El Archivo</a>
        </div>

        <div class="nav-actions" data-auth-header>
            <div id="userProfileBadge" class="user-badge" style="display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.3rem 0.8rem 0.3rem 0.35rem; border-radius: 9999px; background: rgba(184, 147, 69, 0.05); border: 1px solid rgba(184, 147, 69, 0.25); box-shadow: rgba(184, 147, 69, 0.06) 0px 0px 12px;"><span style="display: inline-flex; align-items: center; justify-content: center; width: 1.65rem; height: 1.65rem; border-radius: 50%; background: linear-gradient(135deg, rgba(234, 221, 179, 0.2), rgba(184, 147, 69, 0.15)); border: 1px solid rgba(234, 221, 179, 0.35); font-family: 'Playfair Display', serif; font-size: 0.75rem; font-style: italic; font-weight: 600; color: var(--gold-light);" class="">O</span><span id="userAccountBadge" class="user-badge-email" style="font-family: 'Lora', serif; font-size: 0.82rem; color: var(--text-muted); letter-spacing: 0.3px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">oyente@querencia.es</span></div><button id="logoutBtn" class="logout-btn" type="button">Cerrar sesión</button>
        </div>
    </nav>

    <main>
        <aside>
            <h2 class="sidebar-title">Tus Ecos</h2>
            <ul class="entries-list" id="entriesList" aria-live="polite">
                <li class="entry-empty">Cargando tus ecos...</li>
            </ul>
        </aside>

        <section class="editor-area">
            <div class="diary-view" id="editorView">
                <div class="editor-header">
                    <h1 class="date-title">Hoy.</h1>
                </div>
                <form class="diary-form" id="diaryForm">
                    <input class="title-input" id="diaryTitle" type="text" maxlength="50" autocomplete="off" aria-label="Título de la entrada (opcional)" placeholder="Un título para este eco (opcional)">
                    <div class="diary-vinyl-picker" id="diaryVinylPicker"></div>
                    <textarea id="diaryText" maxlength="5000" aria-label="Texto de la entrada del diario" placeholder="Deja que sangre el alma aquí... Nadie más leerá esto."></textarea>
                    <div class="editor-footer">
                        <button class="save-entry-btn" id="saveEntryBtn" type="submit">Guardar Eco</button>
                    </div>
                </form>
            </div>

            <article class="diary-view reading-view" id="readingView" hidden>
                <div class="reading-topbar">
                    <div class="reading-actions">
                        <button class="reading-action reading-new" id="backToEditorBtn" type="button" title="Nueva entrada" aria-label="Escribir un nuevo eco">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z" fill="currentColor"/>
                            </svg>
                        </button>
                        <button class="reading-action reading-delete" id="deleteReadingBtn" type="button" title="Eliminar eco" aria-label="Eliminar eco">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm4 2v8h1v-8h-1Zm3 0v8h1v-8h-1Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="reading-date" id="readingDate"></p>
                <h1 class="reading-title" id="readingTitle"></h1>
                <div class="reading-vinyl qv-vinyl-slot" id="readingVinyl"></div>
                <div class="reading-content" id="readingContent"></div>
            </article>

            <p class="diary-status" id="diaryStatus" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('soulCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;

        const waves = [
            { amplitude: 220, length: 0.0012, speed: 0.0008, color: 'rgba(75, 12, 12, 0.35)', width: 90, offset: 40 },
            { amplitude: 160, length: 0.0018, speed: 0.0012, color: 'rgba(212, 168, 79, 0.15)', width: 55, offset: 130 },
            { amplitude: 100, length: 0.0025, speed: 0.0018, color: 'rgba(255, 238, 190, 0.08)', width: 25, offset: -30 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 1;

            ctx.filter = 'blur(16px)';

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, height * 0.75 + wave.offset);

                for (let x = 0; x < width; x += 25) {
                    let y = Math.sin((x * wave.length) + (time * wave.speed)) * wave.amplitude;
                    let y2 = Math.cos((x * wave.length * 0.4) + (time * wave.speed * 0.7)) * (wave.amplitude * 0.4);
                    
                    ctx.lineTo(x, (height * 0.75) + y + y2 + wave.offset);
                }

                ctx.strokeStyle = wave.color;
                ctx.lineWidth = wave.width;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/diario.js"></script>



</body></html>
