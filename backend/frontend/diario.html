<!DOCTYPE html><html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Íntimo | Querencia</title>
    <!-- Tipografías literarias con alma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060608;
            --text-main: #f4f4f5;
            --text-muted: #8b8f9e;
            --gold-light: #eaddb3;
            --gold-dark: #b89345;
            --crimson-dark: #3a0a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            /* Textura de grano/ruido analógico */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* --- Lienzo de Humo (Estático, con los tonos vivos del index) --- */
        #soulCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 1;
        }

        /* --- Navegación --- */
        nav {
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(6, 6, 8, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            font-style: italic;
            color: var(--gold-light);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(234, 221, 179, 0.2);
            transition: opacity 0.3s ease;
        }

        .brand:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-link {
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 0.5px;
        }

        .nav-link:hover {
            color: var(--gold-light);
        }

        .nav-link.active {
            color: var(--gold-light);
            font-weight: 500;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
        }

        .nav-actions { 
            display: flex; 
            gap: 1.5rem; 
            align-items: center; 
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        
        .logout-btn:hover {
            border-color: var(--gold-dark);
            color: var(--gold-light);
            background: rgba(184, 147, 69, 0.08);
        }

        /* --- Layout Abierto (Sin cajas ni cuadrados) --- */
        main {
            padding: 0 4rem;
            max-width: 1400px;
            margin: 2rem auto 0;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 5rem;
            height: calc(100vh - 150px);
            min-height: 0;
        }

        /* --- Sidebar (Memoria) --- */
        aside {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-right: 2rem;
        }

        h2.sidebar-title {
            flex-shrink: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            position: relative;
        }

        h2.sidebar-title::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 0;
            width: 30px; height: 1px;
            background-color: var(--gold-dark);
        }

        .entries-list {
            flex: 1;
            min-height: 0;
            padding-right: 0.5rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            list-style: none;
        }

        .entry-item {
            position: relative;
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            transition: border-color 0.4s ease;
        }

        .entry-item:hover,
        .entry-item.is-active {
            border-bottom-color: rgba(184, 147, 69, 0.3);
        }

        .entry-open {
            all: unset;
            box-sizing: border-box;
            display: block;
            flex: 1;
            min-width: 0;
            padding: 1.1rem 2.25rem 1.1rem 0;
            cursor: pointer;
            transition: padding-left 0.4s ease;
        }

        .entry-item:hover .entry-open,
        .entry-open:focus-visible {
            padding-left: 10px;
        }

        .entry-open:focus-visible {
            outline: 1px solid rgba(184, 147, 69, 0.45);
            outline-offset: 2px;
        }

        .entry-date {
            display: block;
            margin-bottom: 0.45rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .entry-label {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            font-family: 'Lora', serif;
            font-size: 0.98rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.55);
            transition: color 0.4s ease;
        }

        .entry-item:hover .entry-label,
        .entry-item.is-active .entry-label {
            color: var(--gold-light);
        }

        .entry-delete {
            position: absolute;
            top: 0.9rem;
            right: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: rgba(232, 160, 160, 0.45);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .entry-delete:hover:not(:disabled),
        .entry-delete:focus-visible {
            color: #e8a0a0;
            border-color: rgba(232, 160, 160, 0.35);
            background: rgba(232, 160, 160, 0.08);
            outline: none;
        }

        .entry-delete:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .entry-empty,
        .entry-error {
            padding: 1rem 0;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-muted);
        }

        .entry-error {
            color: #e8a0a0;
        }

        .editor-area {
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .editor-header {
            margin-bottom: 2rem;
            animation: fadeIn 2s ease;
        }

        .date-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-main);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .diary-view {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .diary-view[hidden] {
            display: none !important;
        }

        .title-input {
            width: 100%;
            margin-bottom: 1.2rem;
            padding: 0.45rem 0;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            color: var(--gold-light);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-style: italic;
            transition: border-color 0.4s ease;
        }

        .title-input:focus {
            outline: none;
            border-bottom-color: rgba(184, 147, 69, 0.55);
        }

        .title-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Lora', serif;
            font-size: 1rem;
            font-style: italic;
        }

            flex: 1 1 auto;
            min-height: 0;
            max-height: 100%;
            padding-right: 0.5rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.25rem;

            flex-direction: column;

            flex-shrink: 0;

            justify-content: flex-end;

            padding-top: 1.5rem;

            padding-top: 0.75rem;

            font-size: 0.9rem;
            font-style: italic;
            color: var(--text-muted);
            text-align: right;

        .diary-status.error { color: #e8a0a0; }

        .save-entry-btn {
            padding: 0.7rem 1.6rem;
            border: 1px solid rgba(184, 147, 69, 0.45);
            border-radius: 30px;
            background: rgba(184, 147, 69, 0.12);
            color: var(--gold-light);
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .save-entry-btn:hover:not(:disabled) {
            background: rgba(184, 147, 69, 0.22);
            border-color: var(--gold-light);
        }

        .save-entry-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reading-view {
            flex: 1;
            min-height: 0;
            max-height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding-right: 0.75rem;
            animation: fadeIn 0.6s ease;
        }

        .entries-list,
        .reading-view,
        textarea {
            scrollbar-width: thin;
            scrollbar-color: rgba(184, 147, 69, 0.35) transparent;
        }

        .entries-list::-webkit-scrollbar,
        .reading-view::-webkit-scrollbar,
        textarea::-webkit-scrollbar {
            width: 4px;
        }

        .entries-list::-webkit-scrollbar-track,
        .reading-view::-webkit-scrollbar-track,
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        .entries-list::-webkit-scrollbar-thumb,
        .reading-view::-webkit-scrollbar-thumb,
        textarea::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(184, 147, 69, 0.35);
        }

        .entries-list::-webkit-scrollbar-thumb:hover,
        .reading-view::-webkit-scrollbar-thumb:hover,
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(184, 147, 69, 0.55);
        }

        .reading-topbar {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 1.2rem;
        }

        .reading-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .reading-action {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid rgba(232, 160, 160, 0.3);
            border-radius: 50%;
            background: rgba(232, 160, 160, 0.06);
            color: rgba(232, 160, 160, 0.75);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reading-action:hover:not(:disabled),
        .reading-action:focus-visible {
            border-color: rgba(232, 160, 160, 0.5);
            background: rgba(232, 160, 160, 0.1);
            color: #e8a0a0;
            outline: none;
        }

        .reading-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reading-action svg {
            width: 15px;
            height: 15px;
        }

        .reading-new {
            border-color: rgba(184, 147, 69, 0.4);
            background: rgba(184, 147, 69, 0.08);
            color: var(--gold-light);
        }

        .reading-new:hover:not(:disabled),
        .reading-new:focus-visible {
            border-color: rgba(234, 221, 179, 0.6);
            background: rgba(184, 147, 69, 0.16);
            color: var(--gold-light);
        }

        .reading-date {
            margin-bottom: 0.8rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .reading-title {
            margin-bottom: 1.8rem;
            overflow-wrap: anywhere;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--gold-light);
        }

        .reading-title.is-untitled {
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-muted);
        }

        .reading-content {
            flex: 0 0 auto;
            padding-bottom: 2rem;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            font-weight: 300;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            nav { padding: 1.2rem 1.5rem; flex-wrap: wrap; gap: 1rem; }
            .nav-links { gap: 1.5rem; order: 3; width: 100%; justify-content: center; }
            main {
                grid-template-columns: 1fr;
                height: auto;
                gap: 2rem;
                padding: 0 1.5rem;
            }
            body { overflow: auto; }
            .editor-area { overflow: visible; }
            .editor-footer { flex-direction: column; align-items: stretch; gap: 0.75rem; }
            .diary-status { text-align: center; }
            .save-entry-btn { width: 100%; }
            .entries-list { max-height: 40vh; }
            textarea { min-height: 40vh; }
            .reading-view {
                max-height: none;
                overflow-y: visible;
                padding-right: 0;
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('soulCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;

        const waves = [
            { amplitude: 220, length: 0.0012, speed: 0.0008, color: 'rgba(75, 12, 12, 0.35)', width: 90, offset: 40 },
            { amplitude: 160, length: 0.0018, speed: 0.0012, color: 'rgba(212, 168, 79, 0.15)', width: 55, offset: 130 },
            { amplitude: 100, length: 0.0025, speed: 0.0018, color: 'rgba(255, 238, 190, 0.08)', width: 25, offset: -30 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 1;

            ctx.filter = 'blur(16px)';

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, height * 0.75 + wave.offset);

                for (let x = 0; x < width; x += 25) {
                    let y = Math.sin((x * wave.length) + (time * wave.speed)) * wave.amplitude;
                    let y2 = Math.cos((x * wave.length * 0.4) + (time * wave.speed * 0.7)) * (wave.amplitude * 0.4);
                    
                    ctx.lineTo(x, (height * 0.75) + y + y2 + wave.offset);
                }

                ctx.strokeStyle = wave.color;
                ctx.lineWidth = wave.width;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

        import { api } from './js/api.js';

        const diaryTitle = document.getElementById('diaryTitle');
        const diaryText = document.getElementById('diaryText');
        const saveEntryBtn = document.getElementById('saveEntryBtn');

        const readingContent = document.getElementById('readingContent');
        const backToEditorBtn = document.getElementById('backToEditorBtn');
        const deleteReadingBtn = document.getElementById('deleteReadingBtn');

        const MAX_TITLE_LENGTH = 50;
        const EXCERPT_LENGTH = 40;

        let entradaSeleccionada = null;
        let estadoTimeout = null;

        const formateadorFecha = new Intl.DateTimeFormat('es-ES', {
            dateStyle: 'long',
            timeStyle: 'short'
        });

        function mostrarEstado(mensaje, tipo = '') {
            if (!diaryStatus) return;

            if (estadoTimeout) {
                clearTimeout(estadoTimeout);
                estadoTimeout = null;
            }

            diaryStatus.textContent = mensaje;
            diaryStatus.classList.remove('success', 'error');
            if (tipo) diaryStatus.classList.add(tipo);

            if (mensaje) {
                estadoTimeout = setTimeout(() => {
                    diaryStatus.textContent = '';
                    diaryStatus.classList.remove('success', 'error');
                    estadoTimeout = null;
                }, 3000);
            }
        }

        function formatearFecha(valor) {
            const fecha = new Date(valor);
            if (!valor || Number.isNaN(fecha.getTime())) return 'Sin fecha';
            return formateadorFecha.format(fecha);
        }

        function obtenerTitulo(entrada) {
            return typeof entrada.title === 'string' ? entrada.title.trim() : '';
        }

        function obtenerEtiqueta(entrada) {
            const titulo = obtenerTitulo(entrada);
            if (titulo) return titulo;

            const texto = typeof entrada.text === 'string'
                ? entrada.text.replace(/\s+/g, ' ').trim()
                : '';
            if (!texto) return 'Eco sin título';
            if (texto.length <= EXCERPT_LENGTH) return texto;
            return `${texto.slice(0, EXCERPT_LENGTH).trimEnd()}…`;
        }

        function marcarEntradaActiva() {
            if (!entriesList) return;
            entriesList.querySelectorAll('.entry-item').forEach((item) => {
                const activa = Boolean(entradaSeleccionada)
                    && item.dataset.id === String(entradaSeleccionada._id);
                item.classList.toggle('is-active', activa);
            });
        }

        function mostrarLectura(entrada) {
            if (!editorView || !readingView) return;

            entradaSeleccionada = entrada;
            const titulo = obtenerTitulo(entrada);

            readingDate.textContent = formatearFecha(entrada.createdAt);
            if (titulo) {
                readingTitle.textContent = titulo;
                readingTitle.classList.remove('is-untitled');
            } else {
                readingTitle.textContent = 'Eco sin título';
                readingTitle.classList.add('is-untitled');
            }
            readingContent.textContent = entrada.text || '';

            editorView.hidden = true;
            readingView.hidden = false;
            readingView.scrollTop = 0;
            marcarEntradaActiva();

            if (backToEditorBtn) backToEditorBtn.focus();
        }

        function mostrarEditor() {
            if (!editorView || !readingView) return;

            entradaSeleccionada = null;
            readingView.hidden = true;
            editorView.hidden = false;
            marcarEntradaActiva();

            if (diaryTitle) diaryTitle.focus();
        }

        function crearEntradaVisual(entrada) {
            const item = document.createElement('li');
            item.className = 'entry-item';
            item.dataset.id = entrada._id ? String(entrada._id) : '';

            const etiqueta = obtenerEtiqueta(entrada);

            const abrir = document.createElement('button');
            abrir.type = 'button';
            abrir.className = 'entry-open';
            abrir.setAttribute('aria-label', `Leer eco: ${etiqueta}`);
            abrir.addEventListener('click', () => mostrarLectura(entrada));

            const fecha = document.createElement('time');
            fecha.className = 'entry-date';
            fecha.dateTime = entrada.createdAt || '';
            fecha.textContent = formatearFecha(entrada.createdAt);

            const titulo = document.createElement('span');
            titulo.className = 'entry-label';
            titulo.textContent = etiqueta;

            abrir.append(fecha, titulo);

            const borrar = document.createElement('button');
            borrar.type = 'button';
            borrar.className = 'entry-delete';
            borrar.textContent = '×';
            borrar.title = 'Eliminar eco';
            borrar.setAttribute('aria-label', `Eliminar eco: ${etiqueta}`);
            borrar.addEventListener('click', () => eliminarEntrada(entrada, borrar));

            item.append(abrir, borrar);
            return item;
        }

        function renderizarEntradas(entradas) {
            if (!entriesList) return;
            entriesList.replaceChildren();

            if (!Array.isArray(entradas) || entradas.length === 0) {
                const vacio = document.createElement('li');
                vacio.className = 'entry-empty';
                vacio.textContent = 'Aún no has escrito ningún eco.';
                entriesList.appendChild(vacio);
                return;
            }

            const fragmento = document.createDocumentFragment();
            entradas.forEach((entrada) => fragmento.appendChild(crearEntradaVisual(entrada)));
            entriesList.appendChild(fragmento);
            marcarEntradaActiva();
        }

        function mostrarErrorEntradas(mensaje) {
            if (!entriesList) return;
            entriesList.replaceChildren();
            const fallo = document.createElement('li');
            fallo.className = 'entry-error';
            fallo.textContent = mensaje;
            entriesList.appendChild(fallo);
        }

        async function cargarEntradas() {
            try {
                const entradas = await api.listarDiario();
                renderizarEntradas(entradas);

                if (entradaSeleccionada) {
                    const sigueExistiendo = Array.isArray(entradas)
                        && entradas.some((entrada) => String(entrada._id) === String(entradaSeleccionada._id));
                    if (!sigueExistiendo) mostrarEditor();
                }
            } catch (error) {
                mostrarErrorEntradas('No se pudo cargar tu diario.');
                mostrarEstado(error.message || 'No se pudo cargar tu diario.', 'error');
            }
        }

        async function guardarEntrada(event) {
            event.preventDefault();
            if (!diaryText || !saveEntryBtn) return;

            const texto = diaryText.value.trim();
            if (!texto) {
                mostrarEstado('Escribe algo antes de guardar tu eco.', 'error');
                diaryText.focus();
                return;
            }

            const titulo = diaryTitle ? diaryTitle.value.trim() : '';
            if (titulo.length > MAX_TITLE_LENGTH) {
                mostrarEstado(`El título no puede superar los ${MAX_TITLE_LENGTH} caracteres.`, 'error');
                if (diaryTitle) diaryTitle.focus();
                return;
            }

            saveEntryBtn.disabled = true;
            mostrarEstado('Guardando tu eco...');

            try {
                await api.crearEntradaDiario(texto, titulo);
                diaryText.value = '';
                if (diaryTitle) diaryTitle.value = '';
                mostrarEstado('Eco guardado.', 'success');
                await cargarEntradas();
            } catch (error) {
                mostrarEstado(error.message || 'No se pudo guardar el eco.', 'error');
            } finally {
                saveEntryBtn.disabled = false;
            }
        }

        async function eliminarEntrada(entrada, boton) {
            if (!entrada || !entrada._id) return;

            const confirmado = window.confirm(
                `¿Eliminar "${obtenerEtiqueta(entrada)}"? Esta acción no se puede deshacer.`
            );
            if (!confirmado) return;

            if (boton) boton.disabled = true;
            mostrarEstado('Eliminando eco...');

            try {
                await api.eliminarEntradaDiario(entrada._id);

                if (entradaSeleccionada
                    && String(entradaSeleccionada._id) === String(entrada._id)) {
                    mostrarEditor();
                }

                mostrarEstado('Eco eliminado.', 'success');
                await cargarEntradas();
            } catch (error) {
                mostrarEstado(error.message || 'No se pudo eliminar el eco.', 'error');
            } finally {
                if (boton) boton.disabled = false;
            }
        }

        async function ejecutarLogout() {
            try {
                await api.logout();
            } catch (error) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = 'index.html';
            }
        }

        window.ejecutarLogout = ejecutarLogout;

        async function inicializarDiario() {
            try {
                const tieneSesion = await api.checkSession();
                if (!tieneSesion) {
                    window.location.href = 'index.html';
                    return;
                }
                await cargarEntradas();
            } catch (error) {
                mostrarErrorEntradas('No se pudo cargar tu diario.');
                mostrarEstado(error.message || 'No se pudo verificar la sesión.', 'error');
            }
        }

        if (diaryForm) {
            diaryForm.addEventListener('submit', guardarEntrada);
        }

        if (backToEditorBtn) {
            backToEditorBtn.addEventListener('click', () => {
                if (diaryText) diaryText.value = '';
                if (diaryTitle) diaryTitle.value = '';
                mostrarEditor();
            });
        }

        if (deleteReadingBtn) {
            deleteReadingBtn.addEventListener('click', () => {
                if (entradaSeleccionada) {
                    eliminarEntrada(entradaSeleccionada, deleteReadingBtn);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', inicializarDiario);
    </script>



</body></html>
