<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Muro de Debates | Querencia</title>
<!-- Tipografías literarias con alma -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
        :root {
            --bg-base: #060608;
            --card-bg: rgba(12, 12, 15, 0.7); 
            --text-main: #f4f4f5;
            --text-muted: #8b8f9e;
            --gold-light: #eaddb3;
            --gold-dark: #b89345;
            --crimson-dark: #3a0a0a;
            --border-color: rgba(184, 147, 69, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            /* Textura de grano/ruido analógico */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* --- Lienzo de Humo (Estático) --- */
        #soulCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 1;
        }

        nav {
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(6, 6, 8, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            font-style: italic;
            color: var(--gold-light);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(234, 221, 179, 0.2);
            transition: opacity 0.3s ease;
        }

        .brand:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-link {
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 0.5px;
        }

        .nav-link:hover {
            color: var(--gold-light);
        }

        .nav-link.active {
            color: var(--gold-light);
            font-weight: 500;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
        }

        .nav-actions { 
            display: flex; 
            gap: 1.5rem; 
            align-items: center; 
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        
        .logout-btn:hover {
            border-color: var(--gold-dark);
            color: var(--gold-light);
            background: rgba(184, 147, 69, 0.08);
        }

        main {
            padding: 4rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 4rem;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--text-main);
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'Lora', serif;
            color: var(--gold-dark);
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .wall-status {
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .wall-status.is-visible {
            opacity: 0.9;
            transform: translateY(0);
        }

        .debate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 3rem;
        }

        .debate-card {
            --mouse-x: 50%;
            --mouse-y: 50%;
            --aura-color: rgba(184, 147, 69, 0.5);
            
            background: linear-gradient(to bottom, rgba(15, 15, 18, 0.8), rgba(10, 10, 12, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(15px);
            border-radius: 6px;
            position: relative;
            transition: transform 0.4s ease, border-top-color 0.4s ease;
        }

        .debate-card:hover {
            transform: translateY(-5px);
            border-top: 1px solid var(--gold-light);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .debate-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 10;
            
            box-shadow: inset 0 0 30px var(--aura-color), inset 0 0 0 1px var(--aura-color);
            -webkit-mask-image: radial-gradient(circle at var(--mouse-x) var(--mouse-y), black 0%, transparent 200px);
            mask-image: radial-gradient(circle at var(--mouse-x) var(--mouse-y), black 0%, transparent 200px);
            
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .debate-card:hover::after {
            opacity: 1;
        }

        .album-cover-wrapper {
            width: 100%;
            height: 220px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 2;
        }

        .album-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease, filter 0.5s ease;
            filter: grayscale(40%) contrast(120%) brightness(0.8);
        }

        .debate-card:hover .album-cover {
            transform: scale(1.05);
            filter: grayscale(0%) contrast(100%) brightness(1);
        }

        .debate-delete {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid rgba(232, 160, 160, 0.18);
            border-radius: 50%;
            background: rgba(6, 6, 8, 0.72);
            color: rgba(232, 160, 160, 0.65);
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .debate-delete:hover:not(:disabled),
        .debate-delete:focus-visible {
            color: #f1b4b4;
            border-color: rgba(232, 160, 160, 0.55);
            background: rgba(90, 18, 18, 0.6);
            outline: none;
        }

        .debate-delete:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .debate-delete-icon {
            width: 1rem;
            height: 1rem;
        }

        .debate-card.is-deleting {
            opacity: 0.45;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .debate-meta {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.75rem;
            color: var(--gold-dark);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 2;
        }

        .debate-meta::before {
            content: '';
            display: block;
            width: 20px;
            height: 1px;
            background-color: var(--gold-dark);
        }

        .debate-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 1.2rem;
            font-weight: 600;
            line-height: 1.3;
            z-index: 2;
            position: relative;
        }

        .debate-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-grow: 1;
            margin-bottom: 2rem;
            z-index: 2;
            position: relative;
        }

        .debate-text {
            font-family: 'Lora', serif;
            color: rgba(244, 244, 245, 0.75);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 0;
        }

        .debate-card.is-collapsible {
            cursor: pointer;
        }

        .debate-read-more {
            display: inline-block;
            margin-top: 0.85rem;
            padding: 0;
            border: 0;
            background: transparent;
            font-family: 'Lora', serif;
            font-size: 0.85rem;
            font-style: italic;
            letter-spacing: 0.5px;
            color: var(--gold-dark);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .debate-read-more::after {
            content: '';
            display: block;
            width: 100%;
            height: 1px;
            margin-top: 0.25rem;
            background: linear-gradient(90deg, rgba(184, 147, 69, 0.55), transparent);
            transform: scaleX(0.4);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .debate-read-more:hover,
        .debate-read-more:focus-visible {
            color: var(--gold-light);
            outline: none;
        }

        .debate-read-more:hover::after,
        .debate-read-more:focus-visible::after {
            transform: scaleX(1);
        }

        .reactions-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 2;
            position: relative;
        }

        .reaction-tag {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            font-style: italic;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .reaction-tag span.count {
            font-family: -apple-system, sans-serif;
            font-style: normal;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s;
        }

        .reaction-tag:hover, .reaction-tag.active {
            border-color: var(--gold-dark);
            color: var(--gold-light);
            background-color: rgba(184, 147, 69, 0.05);
        }

        .reaction-tag:hover span.count, .reaction-tag.active span.count {
            color: var(--gold-dark);
        }

        /* --- Botón flotante y diálogo de administración --- */
        body.admin-modal-open {
            overflow: hidden;
        }

        .admin-fab {
            position: fixed;
            right: 2rem;
            bottom: 2rem;
            z-index: 60;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.75rem;
            height: 3.75rem;
            border: 1px solid rgba(234, 221, 179, 0.5);
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(58, 38, 12, 0.96), rgba(14, 12, 9, 0.98));
            color: var(--gold-light);
            cursor: pointer;
            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.55),
                0 0 24px rgba(184, 147, 69, 0.18),
                inset 0 0 18px rgba(234, 221, 179, 0.08);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .admin-fab::before {
            content: '';
            position: absolute;
            inset: -5px;
            border: 1px solid rgba(184, 147, 69, 0.18);
            border-radius: inherit;
            pointer-events: none;
        }

        .admin-fab:hover,
        .admin-fab:focus-visible {
            transform: translateY(-3px) scale(1.03);
            border-color: var(--gold-light);
            box-shadow:
                0 22px 42px rgba(0, 0, 0, 0.6),
                0 0 32px rgba(184, 147, 69, 0.32),
                inset 0 0 20px rgba(234, 221, 179, 0.14);
            outline: none;
        }

        .admin-fab-icon {
            width: 1.55rem;
            height: 1.55rem;
        }

        .admin-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .admin-modal[hidden] {
            display: none;
        }

        .admin-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(3, 3, 5, 0.78);
            backdrop-filter: blur(7px);
        }

        .admin-dialog {
            position: relative;
            width: min(620px, 100%);
            padding: 2.2rem;
            border: 1px solid var(--border-color);
            border-top: 1px solid rgba(234, 221, 179, 0.4);
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(18, 18, 22, 0.97), rgba(8, 8, 10, 0.99));
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75);
            animation: adminDialogIn 0.35s ease;
        }

        .admin-dialog::before {
            content: '';
            position: absolute;
            top: 0;
            left: 2.2rem;
            right: 2.2rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(234, 221, 179, 0.7), transparent);
            pointer-events: none;
        }

        .admin-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.35rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-modal-close:hover,
        .admin-modal-close:focus-visible {
            color: var(--gold-light);
            border-color: rgba(184, 147, 69, 0.4);
            background: rgba(184, 147, 69, 0.08);
            outline: none;
        }

        @keyframes adminDialogIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .admin-panel-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .admin-panel-title {
            padding-right: 2rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .admin-panel-intro {
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .admin-field {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .admin-field-label {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .admin-field-hint {
            font-family: 'Lora', serif;
            font-size: 0.8rem;
            font-style: italic;
            line-height: 1.5;
            color: rgba(139, 143, 158, 0.85);
        }

        .admin-anonymous {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .admin-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            user-select: none;
        }

        .admin-checkbox-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        .admin-checkbox-box {
            position: relative;
            flex: 0 0 auto;
            width: 1.1rem;
            height: 1.1rem;
            border: 1px solid rgba(184, 147, 69, 0.45);
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .admin-checkbox-box::after {
            content: '';
            position: absolute;
            top: 45%;
            left: 50%;
            width: 0.28rem;
            height: 0.55rem;
            border: solid #120e08;
            border-width: 0 2px 2px 0;
            transform: translate(-50%, -50%) rotate(45deg) scale(0);
            transition: transform 0.18s ease;
        }

        .admin-checkbox-input:checked + .admin-checkbox-box {
            border-color: var(--gold-light);
            background: var(--gold-dark);
            box-shadow: 0 0 10px rgba(184, 147, 69, 0.35);
        }

        .admin-checkbox-input:checked + .admin-checkbox-box::after {
            transform: translate(-50%, -50%) rotate(45deg) scale(1);
        }

        .admin-checkbox-input:focus-visible + .admin-checkbox-box {
            outline: 1px solid var(--gold-light);
            outline-offset: 3px;
        }

        .admin-checkbox-text {
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-main);
        }

        .admin-input,
        .admin-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 0.8rem 1rem;
            color: var(--text-main);
            font-family: 'Lora', serif;
            font-size: 1rem;
            line-height: 1.6;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .admin-input::placeholder,
        .admin-textarea::placeholder {
            color: rgba(139, 143, 158, 0.7);
            font-style: italic;
        }

        .admin-input:focus,
        .admin-textarea:focus {
            outline: none;
            border-color: var(--gold-dark);
            background: rgba(184, 147, 69, 0.04);
        }

        .admin-textarea {
            resize: vertical;
            min-height: 150px;
            scrollbar-width: thin;
            scrollbar-color: rgba(184, 147, 69, 0.35) transparent;
        }

        .admin-textarea::-webkit-scrollbar {
            width: 4px;
        }

        .admin-textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        .admin-textarea::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(184, 147, 69, 0.35);
        }

        .admin-textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(184, 147, 69, 0.55);
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }

        .admin-submit,
        .admin-cancel {
            border-radius: 30px;
            padding: 0.55rem 1.4rem;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-submit {
            background: rgba(184, 147, 69, 0.12);
            color: var(--gold-light);
            border: 1px solid rgba(184, 147, 69, 0.45);
        }

        .admin-submit:hover:not(:disabled),
        .admin-submit:focus-visible:not(:disabled) {
            background: rgba(184, 147, 69, 0.22);
            border-color: var(--gold-light);
            outline: none;
        }

        .admin-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .admin-cancel:hover:not(:disabled),
        .admin-cancel:focus-visible:not(:disabled) {
            color: var(--gold-light);
            border-color: var(--gold-dark);
            outline: none;
        }

        .admin-submit:disabled,
        .admin-cancel:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .admin-feedback {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--gold-light);
        }

        .admin-feedback.is-error {
            color: #d98b8b;
        }

        .reading-modal {
            position: fixed;
            inset: 0;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .reading-modal[hidden] {
            display: none;
        }

        .reading-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(3, 3, 5, 0.82);
            backdrop-filter: blur(8px);
            animation: readingBackdropIn 0.3s ease;
        }

        .reading-dialog {
            position: relative;
            display: flex;
            flex-direction: column;
            width: min(720px, 100%);
            max-height: min(82vh, 780px);
            padding: 2.4rem;
            border: 1px solid rgba(184, 147, 69, 0.28);
            border-top: 1px solid rgba(234, 221, 179, 0.5);
            border-radius: 10px;
            background: linear-gradient(145deg, rgba(18, 18, 22, 0.9), rgba(8, 8, 10, 0.95));
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8), 0 0 70px rgba(184, 147, 69, 0.08);
            animation: readingDialogIn 0.35s ease;
        }

        .reading-dialog::before {
            content: '';
            position: absolute;
            top: 0;
            left: 2.4rem;
            right: 2.4rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(234, 221, 179, 0.7), transparent);
            pointer-events: none;
        }

        .reading-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.35rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reading-modal-close:hover,

</div>
<p class="subtitle wall-status" id="wallStatus" role="status" aria-live="polite" aria-atomic="true" hidden style="text-align: center; margin-top: 2.5rem;">Cargando los ecos del muro...</p>
</main>
<script>
        const canvas = document.getElementById('soulCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;

        const waves = [
            { amplitude: 220, length: 0.0012, speed: 0.0008, color: 'rgba(75, 12, 12, 0.35)', width: 90, offset: 40 },
            { amplitude: 160, length: 0.0018, speed: 0.0012, color: 'rgba(212, 168, 79, 0.15)', width: 55, offset: 130 },
            { amplitude: 100, length: 0.0025, speed: 0.0018, color: 'rgba(255, 238, 190, 0.08)', width: 25, offset: -30 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 1;
            ctx.filter = 'blur(16px)';

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, height * 0.75 + wave.offset);

                for (let x = 0; x < width; x += 25) {
                    let y = Math.sin((x * wave.length) + (time * wave.speed)) * wave.amplitude;
                    let y2 = Math.cos((x * wave.length * 0.4) + (time * wave.speed * 0.7)) * (wave.amplitude * 0.4);
                    ctx.lineTo(x, (height * 0.75) + y + y2 + wave.offset);
                }
                ctx.strokeStyle = wave.color;
                ctx.lineWidth = wave.width;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
