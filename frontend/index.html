<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Querencia | El refugio del oyente</title>
    <!-- Tipografías literarias con alma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060608;
            --glass-bg: rgba(10, 10, 12, 0.65); 
            --text-main: #f4f4f5;
            --text-muted: #8b8f9e;
            --gold-light: #eaddb3;
            --gold-dark: #b89345;
            --crimson-dark: #3a0a0a;
            --border-color: rgba(184, 147, 69, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            position: relative;
            /* Textura de grano/ruido analógico */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* --- Lienzo de Humo Interactivo y Destacado --- */
        #soulCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: auto; /* Permite capturar el movimiento del ratón */
            opacity: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Deja pasar el ratón al canvas en las zonas vacías */
        }

        .content-wrapper > * {
            pointer-events: auto; /* Reactiva los clics en los formularios */
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 2s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
            color: var(--gold-light);
            font-weight: 700;
            font-style: italic;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(234, 221, 179, 0.25);
        }

        p.subtitle {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            color: rgba(244, 244, 245, 0.8);
            font-style: italic;
            letter-spacing: 1px;
        }

        /* --- Panel de Cristal (Glassmorphism) --- */
        .auth-panel {
            background-color: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            width: 100%;
            max-width: 850px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4), 0 20px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            animation: fadeInUp 1.5s ease 0.5s both;
        }

        .auth-section {
            flex: 1;
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
        }

        .divider {
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(184, 147, 69, 0.3), transparent);
        }

        .auth-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            color: var(--text-main);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .auth-section h2 svg {
            width: 20px; height: 20px;
            fill: none; stroke: var(--gold-dark);
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            height: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            padding: 0.8rem 0;
            font-size: 1.1rem;
            font-family: 'Lora', serif;
            transition: border-color 0.4s ease;
        }

        input:focus {
            outline: none;
            border-bottom-color: var(--gold-light);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #0a0a0c inset !important;
            -webkit-text-fill-color: var(--text-main) !important;
        }

        .forgot-link {
            align-self: flex-end;
            font-family: 'Lora', serif;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-style: italic;
            margin-top: -1.2rem;
            transition: color 0.3s;
        }

        .forgot-link:hover { color: var(--gold-light); }

        .btn-spacer { flex-grow: 1; }

        button {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-dark);
            padding: 1rem;
            border-radius: 30px;
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(184, 147, 69, 0.15);
            box-shadow: 0 0 25px rgba(184, 147, 69, 0.25);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .auth-panel { flex-direction: column; }
            .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, rgba(184, 147, 69, 0.3), transparent); }
            .auth-section { padding: 2.5rem; }
            h1 { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <!-- Lienzo de ondas interactivas llamativas -->
    <canvas id="soulCanvas"></canvas>

    <div class="content-wrapper">
        <header>
            <h1>Querencia.</h1>
            <p class="subtitle">No escuches música. Siéntela, piénsala, compártela.</p>
        </header>

        <div class="auth-panel">
            <div class="auth-section">
                <h2>Entrar al Tablao 
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </h2>
                <form id="login-form">
                    <div class="input-group">
                        <input type="email" id="login-email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-password" placeholder="Contraseña" required>
                    </div>
                    <a href="#" class="forgot-link">Olvidé mi contraseña</a>
                    <div class="btn-spacer"></div>
                    <button type="submit">Iniciar Sesión</button>
                </form>
            </div>

            <div class="divider"></div>

            <div class="auth-section">
                <h2>Crear cuenta 
                    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </h2>
                <form id="register-form">
                    <div class="input-group">
                        <input type="email" id="reg-email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                    </div>
                    <div class="btn-spacer"></div>
                    <button type="submit">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script de ondas dinámicas con alta respuesta al ratón -->
    <script>
        const canvas = document.getElementById('soulCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;
        let mouseX = -1000;
        let mouseY = -1000;

        // Ondas más definidas, con colores más vivos y mayor amplitud
        const waves = [
            { amplitude: 220, length: 0.0012, speed: 0.0012, color: 'rgba(75, 12, 12, 0.35)', width: 90, offset: 40 },
            { amplitude: 160, length: 0.0018, speed: 0.0018, color: 'rgba(212, 168, 79, 0.15)', width: 55, offset: 130 },
            { amplitude: 100, length: 0.0025, speed: 0.0025, color: 'rgba(255, 238, 190, 0.08)', width: 25, offset: -30 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Rastrear el ratón por toda la pantalla
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 1;

            // Menos blur para que el humo resalte con fuerza y se vea nítido
            ctx.filter = 'blur(16px)';

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, height * 0.75 + wave.offset);

                for (let x = 0; x < width; x += 20) {
                    let distToMouse = Math.abs(x - mouseX);
                    let influence = Math.max(0, 400 - distToMouse) / 400; // Mayor radio de atracción (400px)
                    
                    // Reacción mucho más marcada y viva al acercar el cursor
                    let dynamicAmplitude = wave.amplitude + (influence * 120);
                    
                    let y = Math.sin((x * wave.length) + (time * wave.speed)) * dynamicAmplitude;
                    let y2 = Math.cos((x * wave.length * 0.4) + (time * wave.speed * 0.7)) * (dynamicAmplitude * 0.4);
                    
                    let verticalPull = (mouseY - (height * 0.75)) * influence * 0.15;

                    ctx.lineTo(x, (height * 0.75) + y + y2 + wave.offset + verticalPull);
                }

                ctx.strokeStyle = wave.color;
                ctx.lineWidth = wave.width;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
